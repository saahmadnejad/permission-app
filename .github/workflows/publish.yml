# npm publish pipeline for the 4-package monorepo.
#
# Publishes every workspace package under packages/ that is NOT "private": true
# (today: permission-visibility-{core,demo-data,angular,react}).
#
# SETUP (maintainer, one time — secrets are NEVER committed):
#   1. Revoke any npm token that was ever pasted into chat, tickets, or logs
#      (npmjs.com → Access Tokens → revoke). Pasted tokens are compromised.
#   2. Recommended: enable *trusted publishing* (OIDC) on each npm package,
#      pointing at this repo + this workflow file (.github/workflows/publish.yml),
#      environment "npm" (or remove the environment below). Then NO token/secret
#      is needed — npm mints a short-lived token per run.
#   3. Fallback: create a *granular automation* token scoped to just these
#      packages and add it as a GitHub repo secret named NPM_TOKEN
#      (Repo → Settings → Secrets and variables → Actions).
#   4. Publish by cutting a GitHub Release (any tag) or running this workflow
#      manually (Actions → Publish to npm → Run workflow, dry-run default true).
#
# First release tip: core has no internal deps, but angular/react/demo-data
# depend on permission-visibility-core@0.1.0 — when bumping versions, bump core
# first and keep the dependents' "dependencies" ranges in sync.
#
# This workflow only ever reads ${{ secrets.NPM_TOKEN }} at runtime.
# No token value exists in this repo, its history, or its logs.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish --dry-run instead of publishing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write # required for --provenance (Sigstore) and OIDC trusted publishing

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.ls.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - name: List publishable (non-private) workspace packages
        id: ls
        run: |
          PACKAGES=$(node -e '
            const fs = require("fs");
            const out = [];
            for (const e of fs.readdirSync("packages", { withFileTypes: true })) {
              if (!e.isDirectory()) continue;
              const dir = "packages/" + e.name;
              const p = JSON.parse(fs.readFileSync(dir + "/package.json", "utf8"));
              if (p.private) { console.error("skip (private): " + (p.name || dir)); continue; }
              out.push({ name: p.name, version: p.version, dir: dir });
            }
            console.log(JSON.stringify(out));
          ')
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Publishable packages: $PACKAGES"
          [ "$(echo "$PACKAGES" | jq 'length')" -gt 0 ] || { echo "::error::No publishable packages found"; exit 1; }

  build-test:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (workspace-aware)
        run: npm ci --no-audit --no-fund

      - name: Build all packages
        run: npm run build:packages

      - name: Test all packages
        run: npm run test:packages

  publish:
    needs: [discover, build-test]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (needed for --workspaces publish + provenance)
        run: npm install -g npm@latest

      - name: Install dependencies (workspace-aware)
        run: npm ci --no-audit --no-fund

      - name: Verify publishable packages
        run: |
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            node -e "
              const p = require('./' + process.argv[1] + '/package.json');
              if (p.private) { console.log('skip (private): ' + (p.name || process.argv[1])); process.exit(0); }
              if (!p.name || !p.version) { console.error('::error::package.json needs name and version: ' + process.argv[1]); process.exit(1); }
              if (!p.repository || !p.repository.url) { console.error('::error::provenance requires a repository field: ' + process.argv[1]); process.exit(1); }
              console.log('Will publish ' + p.name + '@' + p.version);
            " "${dir%/}"
          done

      - name: Configure npm auth (token fallback only)
        env:
          NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$NPM_TOKEN_SET" = "true" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
            echo "Auth: NPM_TOKEN secret."
          else
            touch ~/.npmrc
            sed -i '/registry.npmjs.org\/:_authToken/d' ~/.npmrc
            echo "Auth: OIDC trusted publishing (no secret configured)."
          fi

      - name: Publish all packages (single --workspaces call, topological)
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          ARGS="--workspaces --access public"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            ARGS="$ARGS --provenance"
          fi
          # npm resolves workspace dependency order itself (core before dependents).
          npm publish $ARGS

      - name: Job summary
        if: always()
        run: |
          echo "### npm publish result (${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "dry_run: $DRY_RUN_MODE" >> "$GITHUB_STEP_SUMMARY"
        env:
          DRY_RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
